name: validate

# The check every pull request runs: formatting, lint, types, tests and the API contract, and
# cfn-lint on the stacks in infra/. A green run on main is what releases it (deploy.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions. Actions are pinned to commit SHAs, and checkout leaves no token
# behind. No package install scripts run.
permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: install
        run: npm ci --ignore-scripts
      - name: verify
        run: npm run verify
      - name: cfn-lint
        run: pipx run --spec cfn-lint==1.57.2 cfn-lint infra/template.yaml infra/deploy.yaml infra/backup.yaml
