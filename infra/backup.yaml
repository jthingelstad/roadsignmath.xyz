AWSTemplateFormatVersion: "2010-09-09"
Description: Road Sign Math backups - a monthly AWS Backup recovery point of the roadsignmath-xyz table and photo bucket, each deleted 330 days after it is made, so anything deleted leaves them within a year

# A separate small stack (roadsignmath-xyz-backup), never the application stack, and never
# deployed from a workflow: the GitHub deploy role and the CloudFormation service role have no AWS
# Backup permissions and cannot edit this role, whose name does not start with roadsignmath-xyz-.
# Applied by hand with the cloud-engineer profile, after the application stack exists:
#
#   aws cloudformation deploy --stack-name roadsignmath-xyz-backup \
#     --template-file infra/backup.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --tags Application=RoadSignMath Project=roadsignmath.xyz ManagedBy=cloudformation
#
# The table keeps its own 35-day point-in-time recovery and the photo bucket its versions. This
# adds one copy of each a month, on the 1st, and deletes each copy 330 days after it is made. Jamie,
# 2026-11-10: backups expire after a year, and /privacy and /support say anything deleted is gone
# from them within a year. A photo copy holds every version in the bucket when it is made, and the
# bucket keeps a deleted photo's old version for 30 days (old-versions-expire in template.yaml), so
# a copy made then could keep it for 30 days more than the copy's own age. 330 days plus those 30,
# with a few days for S3's lifecycle and AWS Backup to run, stays inside the year. Change one with
# the other in mind. A lifecycle change reaches only recovery points made after it is applied: one
# made before keeps the lifecycle it was made with until it is changed by hand
# (aws backup update-recovery-point-lifecycle). A restore goes to a new table or bucket, never over
# the live one.

Parameters:
  ApplicationStackName:
    Type: String
    Default: roadsignmath-xyz
    AllowedValues: [roadsignmath-xyz]

Resources:
  Vault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: roadsignmath-xyz-backups

  # S3 backups need the bucket versioned (it is) and the S3 policies besides the general ones.
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: RoadSignMathBackup
      Description: AWS Backup makes and restores the Road Sign Math table and photo bucket recovery points
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: backup.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBackupServiceRolePolicyForS3Backup
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBackupServiceRolePolicyForS3Restore

  Plan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: roadsignmath-xyz-monthly
        BackupPlanRule:
          # Each recovery point is deleted 330 days after it is made: with the bucket's 30 days of
          # old versions, a deleted photo leaves every copy within a year (see the top).
          - RuleName: monthly
            TargetBackupVault: !Ref Vault
            ScheduleExpression: cron(0 4 1 * ? *)
            ScheduleExpressionTimezone: America/Chicago
            StartWindowMinutes: 60
            CompletionWindowMinutes: 720
            Lifecycle:
              DeleteAfterDays: 330
            RecoveryPointTags:
              Application: RoadSignMath
              Project: roadsignmath.xyz

  Selection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref Plan
      BackupSelection:
        SelectionName: table-and-photos
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationStackName}
          - !Sub arn:${AWS::Partition}:s3:::${ApplicationStackName}-photos-${AWS::AccountId}

Outputs:
  VaultName:
    Value: !Ref Vault
  PlanId:
    Value: !Ref Plan
  BackupRoleArn:
    Value: !GetAtt BackupRole.Arn
